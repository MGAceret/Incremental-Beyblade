<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>incremental-beyblade</title>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="" alt="Chemist3 Logo">
        <h1>Incremental-Beyblade<span> by MGAceret</span></h1>
      </div>
      <div class="header-actions">
        <button id="sound-btn" class="header-btn">Sound</button>
        <button id="stats-btn" class="header-btn">Logs and Stats</button>
        <button id="wipe-btn" class="header-btn">Wipe</button>
      </div>
    </header>
    <div id="app">
      <!-- Arena Container -->
      <div class="arena-container">
        <div>
          <!-- Arena Rim (and its beyblade) -->
          <canvas id="arena-canvas" width="600" height="600"></canvas>
          <!-- Survival Bar -->
          <div class="survival-bar">
            <span id="current">Current: 0.0s</span>
            <span class="title">Survival</span>
            <span id="record">Record: 0.0s</span>
          </div>
        </div>
        <!-- Speed/ RPM Gauge -->
        <div class="gauge-container">
          <div class="gauge-header">
            <span>Speed</span>
            <span>0 / 1000</span>
          </div>
          <div class="gauge-bar-bg">
            <div class="gauge-bar-fill"></div>
          </div>
        </div>
        <!-- Ripcord Launcher -->
        <div class="ripcord-container">
          <div class="ripcord-title">Ripcord</div>
          <div class="ripcord-track">
            <div class="ripcord-target"></div>
            <div class="ripcord-needle"></div>
          </div>
          <button id="ripcord-btn" type="button">PULL IT</button>
        </div>
      </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
